# Compose >=2.24.4 required for !reset. Layer over compose.yaml.
services:
  db:
    ports: !reset []
  ml:
    ports: !reset []
  backend:
    ports: !reset []
  frontend:
    ports: !reset []
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
volumes:
  caddy_data:
  caddy_config:
