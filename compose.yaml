name: keiba
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keiba
      MYSQL_USER: keiba
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-env.py}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
  ml:
    build:
      context: ./ml

    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ./backend

    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/keiba?connectionTimeZone=UTC
      DB_USER: keiba
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.py}
      ML_URL: http://ml:8000
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      ml: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend

    restart: unless-stopped
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
