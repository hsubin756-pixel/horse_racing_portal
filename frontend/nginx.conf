limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
server {
 # Production frontend is private; only the Caddy gateway can reach it externally.
 # Caddy overwrites untrusted incoming X-Forwarded-For by default.
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 10.0.0.0/8;
 set_real_ip_from 192.168.0.0/16;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 32k;
 location ~ ^/api/auth/(login|register)$ {
  limit_req zone=auth burst=10 nodelay;
  limit_req_status 429;
  error_page 429 = @limited;
  proxy_pass http://backend:8080;
  proxy_connect_timeout 3s;
  proxy_read_timeout 10s;
 }
 location @limited {
  default_type application/json;
  return 429 '{"message":"요청이 너무 많습니다. 잠시 후 다시 시도하세요."}';
 }
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_connect_timeout 3s;
  proxy_read_timeout 10s;
 }
 location / { try_files $uri $uri/ /index.html; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
}
